name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      intelligence: ${{ steps.filter.outputs.intelligence }}
      dapp: ${{ steps.filter.outputs.dapp }}
      api: ${{ steps.filter.outputs.api }}
      contracts: ${{ steps.filter.outputs.contracts }}
      shared: ${{ steps.filter.outputs.shared }}
      slo: ${{ steps.filter.outputs.slo }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            shared:
              - '.github/workflows/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
            website:
              - 'apps/website/**'
            intelligence:
              - 'apps/intelligence/**'
            dapp:
              - 'apps/dapp/**'
            api:
              - 'apps/api/**'
            contracts:
              - 'packages/contracts/**'
            slo:
              - 'docker/prometheus/**'

  migration-safety:
    name: Migration Safety Checks
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nester
          POSTGRES_PASSWORD: nester
          POSTGRES_DB: nester_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Migration Safety Script
        env:
          DATABASE_URL: postgres://nester:nester@localhost:5432/nester_dev?sslmode=disable
        run: |
		  cd apps/api
		  go run scripts/verify_migrations.go
